# 보안 헤더. nginx는 location 안에 add_header가 하나라도 있으면 서버 수준 add_header를 상속하지 않는다.
# 그래서 서버 수준과, 이미 add_header가 있는 location(/assets/, /index.html)에서 모두 이 파일을 include 한다.
# CSP는 소셜 로그인 리다이렉트와 충돌하는지 확인한 뒤에 넣는다 (#155).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
