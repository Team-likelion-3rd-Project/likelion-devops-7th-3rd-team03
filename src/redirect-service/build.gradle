plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

// CVE-2026-75595 (netty-handler, CRITICAL) 대응.
// Spring Boot가 관리하는 netty 버전(4.2.15)을 패치 버전으로 올린다.
// Spring Boot를 올렸을 때 기본 netty가 4.2.17 이상이면 이 줄은 지운다.
ext['netty.version'] = '4.2.17.Final'

// CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (tomcat-embed-core, CRITICAL) 대응.
// Spring Boot가 관리하는 Tomcat(11.0.24)을 패치 버전으로 올린다.
// Spring Boot를 올렸을 때 기본 Tomcat이 11.0.25 이상이면 이 줄은 지운다.
ext['tomcat.version'] = '11.0.25'

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-json'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'nl.basjes.parse.useragent:yauaa:8.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation platform('software.amazon.awssdk:bom:2.28.29')
	implementation 'software.amazon.awssdk:firehose'
	// IRSA(redirect-service-sa) 인증은 SDK 기본 자격증명 체인이 자동 처리한다.
	implementation 'software.amazon.awssdk:sts'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway'   // MySqlRedirectControllerIntegrationTest: Testcontainers MySQL 스키마 세팅용. 앱 런타임은 flyway.enabled=false
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter:2.0.5'
	testImplementation 'org.testcontainers:testcontainers-mysql:2.0.5'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.flywaydb:flyway-mysql'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('processTestResources') {
	from('../db') {
		include 'V*__*.sql'
		into 'db/migration'
	}
}
