plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'

}
// CVE-2026-75595 (netty-handler, CRITICAL) 대응.
// Spring Boot가 관리하는 netty 버전(4.2.15)을 패치 버전으로 올린다.
// Spring Boot를 올렸을 때 기본 netty가 4.2.17 이상이면 이 줄은 지운다.
ext['netty.version'] = '4.2.17.Final'

// CVE-2026-65182, CVE-2026-65905, CVE-2026-68525 (tomcat-embed-core, CRITICAL) 대응.
// Spring Boot가 관리하는 Tomcat(11.0.24)을 패치 버전으로 올린다.
// Spring Boot를 올렸을 때 기본 Tomcat이 11.0.25 이상이면 이 줄은 지운다.
ext['tomcat.version'] = '11.0.25'

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'service-management'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'   //env
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation platform('software.amazon.awssdk:bom:2.28.29')
	implementation 'software.amazon.awssdk:athena'
	// IRSA(EKS 서비스어카운트) 인증은 SDK 기본 자격증명 체인이 자동 처리한다
	// (AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE 환경변수를 CronJob이 자동 주입).
	implementation 'software.amazon.awssdk:sts'
	// 온프렘 배치 집계 엔진 (BATCH_ENGINE=duckdb). 배치 JVM 안에서 라이브러리로 실행된다.
	implementation 'org.duckdb:duckdb_jdbc:1.1.3'

	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('jar') {
	enabled = false
}