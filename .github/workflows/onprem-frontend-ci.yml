# 온프렘 dev용 프론트 이미지를 GHCR에 올린다.
#   develop 에 src/frontend 가 머지되면 ghcr.io/<소유자>/<저장소>-frontend:<커밋 SHA> 를 만든다.
#   올린 뒤 overlays/dev 의 프론트 태그를 그 SHA 로 바꿔 develop 에 커밋한다 (Argo CD 가 이 변경을 보고 배포한다).
#   이미지는 amd64·arm64 를 한 태그에 같이 올린다 (Apple Silicon 맥의 로컬 클러스터도 같은 태그를 받는다).
#   push 전에 Trivy 로 CRITICAL 취약점을 검사해, 발견되면 올리지 않는다 (백엔드와 같은 .github/scripts/trivy-scan.sh).
#   AWS(S3) 배포는 frontend-ci.yml 이 따로 한다.
# 조직의 GHCR 는 여러 팀이 공유하므로 이름에 저장소 이름을 붙인다.
# 패키지의 "Manage Actions access"에 이 저장소가 Write 로 등록되어 있어야 push 가 된다.
name: Onprem Frontend Image

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/frontend/**'
      - '.github/workflows/onprem-frontend-ci.yml'
      - '.github/scripts/trivy-scan.sh'

# 태그 반영 커밋은 CI 봇 토큰으로 push 하므로 기본 토큰은 읽기만 한다.
permissions:
  contents: read
  packages: write

# 연속으로 머지되면 앞의 실행은 취소한다.
# 취소되기 전에 이미 끝까지 간 실행이나 예전 실행 Re-run 이 옛 SHA 로 덮어쓰는 것은 Bump overlay tag 의 검사가 막는다.
concurrency:
  group: onprem-frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    # 평소 1분 안팎이고 캐시 없는 첫 빌드가 14분이었다. 멈추면 기본 6시간을 기다리지 않고 실패(timed_out)로 알린다.
    timeout-minutes: 20
    env:
      # 구글이 IP·HTTP redirect URI 를 받지 않아 3종 모두 localhost 터널 주소로 통일한다.
      # localhost:3000 은 모든 PC에서 같은 주소라 이미지 하나를 같이 쓴다. 로그인은 터널(ssh -L 3000:...)을 연 상태에서 된다.
      BASE_URL: http://localhost:3000
      # 클라이언트 ID 는 브라우저 번들에 공개되는 값이라 Secret 이든 Variable 이든 된다. Secret 이 있으면 그것을 쓴다.
      KAKAO_ID: ${{ secrets.KAKAO_CLIENT_ID || vars.KAKAO_CLIENT_ID }}
      GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
      NAVER_ID: ${{ secrets.NAVER_CLIENT_ID || vars.NAVER_CLIENT_ID }}
    steps:
      # develop 보호 규칙의 우회 대상인 CI 봇(GitHub App) 토큰을 받는다. 태그 커밋 push 에 쓴다.
      - name: CI 봇 토큰 발급
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
          # 아래 git log $GITHUB_SHA..origin/develop 검사에 히스토리가 필요하다
          fetch-depth: 0

      - name: GHCR login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # arm64(Apple Silicon 맥)용 이미지도 같이 올리려면 Buildx 가 필요하다.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 번들 검증용으로 러너와 같은 amd64 이미지를 먼저 만들어 로컬에 둔다 (--load).
      # ID 가 비면 그 provider 의 로그인 버튼이 말없이 사라진 이미지가 만들어지므로 여기서 멈춘다.
      - name: Build image
        run: |
          for v in KAKAO_ID GOOGLE_ID NAVER_ID; do
            [ -n "${!v}" ] || { echo "::error::$v 값이 비어 있습니다. 저장소 Variables 에 ${v%_ID}_CLIENT_ID 를 등록하세요."; exit 1; }
          done
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-frontend"
          # push 단계에서 같은 값으로 다시 빌드한다. 값에 공백이 없는 공개 값이라 한 줄로 넘겨도 된다.
          BUILD_ARGS="--build-arg VITE_SOCIAL_PROVIDERS=kakao,google,naver"
          BUILD_ARGS="$BUILD_ARGS --build-arg VITE_KAKAO_CLIENT_ID=$KAKAO_ID --build-arg VITE_KAKAO_REDIRECT_URI=$BASE_URL/auth/kakao/callback"
          BUILD_ARGS="$BUILD_ARGS --build-arg VITE_GOOGLE_CLIENT_ID=$GOOGLE_ID --build-arg VITE_GOOGLE_REDIRECT_URI=$BASE_URL/auth/google/callback"
          BUILD_ARGS="$BUILD_ARGS --build-arg VITE_NAVER_CLIENT_ID=$NAVER_ID --build-arg VITE_NAVER_REDIRECT_URI=$BASE_URL/auth/naver/callback"
          { echo "IMAGE=$IMAGE"; echo "BUILD_ARGS=$BUILD_ARGS"; } >> "$GITHUB_ENV"
          docker buildx build --load --platform linux/amd64 -f src/frontend/Dockerfile.prod \
            -t "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            $BUILD_ARGS src/frontend

      # push 전에 번들에 3종의 로그인 주소와 클라이언트 ID가 실제로 들어갔는지 확인한다. 하나라도 없으면 여기서 멈춘다.
      - name: Verify bundle
        run: |
          for needle in \
            "$BASE_URL/auth/kakao/callback" "$BASE_URL/auth/google/callback" "$BASE_URL/auth/naver/callback" \
            "$KAKAO_ID" "$GOOGLE_ID" "$NAVER_ID"; do
            docker run --rm --entrypoint grep "$IMAGE:$GITHUB_SHA" -rqF -- "$needle" /usr/share/nginx/html \
              || { echo "::error::번들에 값이 들어가지 않았습니다 (값은 로그에 남기지 않음)"; exit 1; }
          done

      - name: 날짜 (Trivy DB 캐시 키)
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 취약점 DB만 하루 단위로 캐시한다 (백엔드 워크플로와 같은 키를 써서 같이 재사용한다).
      # 실행마다 새 캐시를 만들면 저장소 한도(10GB)가 차서 다른 빌드 캐시가 먼저 지워진다
      - name: Trivy DB 캐시
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      # CRITICAL 취약점(패치 있는 것)이 있으면 여기서 멈춘다. 아래 push·태그 반영이 실행되지 않는다.
      # 위에서 --load 한 amd64 이미지로 검사한다. arm64 는 같은 베이스 이미지·같은 번들이라 패키지 버전이 같다.
      - name: 이미지 취약점 스캔 (CRITICAL이면 push 중단)
        run: bash .github/scripts/trivy-scan.sh "$IMAGE:$GITHUB_SHA"

      # 번들 검증을 통과한 뒤 amd64·arm64 를 한 태그로 푸시한다. 위에서 같은 값으로 빌드해 두어서 캐시로 금방 끝난다.
      # --provenance=false: GHCR 에 플랫폼 정보가 없는 unknown/unknown 항목이 따로 생기지 않게 한다.
      - name: Push image (amd64, arm64)
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64 --provenance=false \
            -f src/frontend/Dockerfile.prod \
            -t "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            $BUILD_ARGS src/frontend
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" > /tmp/image-index.txt
          for p in linux/amd64 linux/arm64; do
            grep -Eq "Platform:[[:space:]]+$p" /tmp/image-index.txt || { echo "::error::푸시한 이미지에 $p 플랫폼이 없습니다"; exit 1; }
          done
          echo "pushed $IMAGE:$GITHUB_SHA (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

      # overlays/dev 의 프론트 태그를 이 SHA 로 바꿔 develop 에 커밋한다. Argo CD 가 이 변경을 보고 배포한다.
      # 최신 develop 위에서 태그를 바꿔 push 한다. 백엔드·다른 프론트 태그 커밋과 겹쳐 push 가 거부되면
      # 최신 develop 을 다시 받아 처음부터 다시 바꿔 push 한다. rebase 를 쓰지 않아서 충돌이 생기지 않는다.
      # 이 실행보다 더 새 프론트 변경이 develop 에 이미 있으면 건너뛴다. 그 실행이 더 새 태그를 넣는다.
      # (늦게 끝난 실행이나 예전 실행 Re-run 이 최신 태그를 옛 SHA 로 덮어쓰는 것을 막는다)
      # 봇 토큰으로 push 한 커밋은 다른 워크플로를 깨울 수 있지만, 각 워크플로의 paths 필터와 [skip ci] 로 다시 돌지 않는다.
      # 다른 브랜치에서 workflow_dispatch 로 돌릴 때 develop 태그를 건드리지 않는다.
      - name: Bump overlay tag
        if: github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          BOT="${{ steps.bot.outputs.app-slug }}[bot]"
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"

          # 이 워크플로가 이미지를 새로 만드는 경로 (on.push.paths 와 같게 맞춘다)
          FRONTEND_PATHS=(src/frontend .github/workflows/onprem-frontend-ci.yml .github/scripts/trivy-scan.sh)

          for i in 1 2 3; do
            # bash -e 라 fetch 가 실패하면 스텝이 바로 끝난다. 일시적인 네트워크 오류도 재시도하게 한다
            git fetch origin develop || { echo "fetch 실패, 재시도 ($i/3)"; sleep $((i * 3)); continue; }
            git reset --hard origin/develop

            if [ -n "$(git log --oneline "$GITHUB_SHA"..origin/develop -- "${FRONTEND_PATHS[@]}")" ]; then
              echo "develop 에 이 실행(${GITHUB_SHA::7})보다 새 프론트 변경이 있어 건너뜁니다. 그 실행이 태그를 바꿉니다."
              exit 0
            fi

            bash infra/onprem/bump-image-tag.sh frontend "$GITHUB_SHA"
            git add infra/k8s/overlays/dev/kustomization.yaml
            if git diff --cached --quiet; then
              echo "태그가 이미 같아서 커밋하지 않습니다."
              exit 0
            fi
            git commit -m "chore: 프론트 이미지 태그를 ${GITHUB_SHA::7}로 갱신 [skip ci]"

            git push origin HEAD:develop && exit 0
            echo "push 실패, develop 을 다시 받아 재시도 ($i/3)"
            sleep $((i * 3))
          done
          echo "::error::태그 커밋을 develop 에 push 하지 못했습니다. 브랜치 보호나 권한을 확인하세요."
          exit 1