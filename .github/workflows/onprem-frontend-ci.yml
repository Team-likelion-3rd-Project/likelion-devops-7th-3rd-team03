# 온프렘 dev용 프론트 이미지를 GHCR에 올린다.
#   develop 에 src/frontend 가 머지되면 ghcr.io/<소유자>/<저장소>-frontend:<커밋 SHA> 를 만든다.
#   올린 뒤 overlays/dev 의 프론트 태그를 그 SHA 로 바꿔 develop 에 커밋한다 (Argo CD 가 이 변경을 보고 배포한다).
#   AWS(S3) 배포는 frontend-ci.yml 이 따로 한다.
# 조직의 GHCR 는 여러 팀이 공유하므로 이름에 저장소 이름을 붙인다.
# 패키지의 "Manage Actions access"에 이 저장소가 Write 로 등록되어 있어야 push 가 된다.
name: Onprem Frontend Image

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/frontend/**'
      - '.github/workflows/onprem-frontend-ci.yml'

# 태그 반영 커밋은 CI 봇 토큰으로 push 하므로 기본 토큰은 읽기만 한다.
permissions:
  contents: read
  packages: write

# 연속으로 머지되면 앞의 실행은 취소한다. 앞 실행이 늦게 끝나 옛 SHA 로 태그를 덮어쓰는 일을 줄인다.
# ponytail: 취소 직전에 이미 push 한 경우의 역전은 막지 못한다. 문제가 되면 push 직전에 develop 최신 SHA 와 비교한다.
concurrency:
  group: onprem-frontend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    env:
      # 구글이 IP·HTTP redirect URI 를 받지 않아 3종 모두 localhost 터널 주소로 통일한다.
      # localhost:3000 은 모든 PC에서 같은 주소라 이미지 하나를 같이 쓴다. 로그인은 터널(ssh -L 3000:...)을 연 상태에서 된다.
      BASE_URL: http://localhost:3000
      # 클라이언트 ID 는 브라우저 번들에 공개되는 값이라 Secret 이든 Variable 이든 된다. Secret 이 있으면 그것을 쓴다.
      KAKAO_ID: ${{ secrets.KAKAO_CLIENT_ID || vars.KAKAO_CLIENT_ID }}
      GOOGLE_ID: ${{ secrets.GOOGLE_CLIENT_ID || vars.GOOGLE_CLIENT_ID }}
      NAVER_ID: ${{ secrets.NAVER_CLIENT_ID || vars.NAVER_CLIENT_ID }}
    steps:
      # develop 보호 규칙의 우회 대상인 CI 봇(GitHub App) 토큰을 받는다. 태그 커밋 push 에 쓴다.
      - name: CI 봇 토큰 발급
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
          # 태그 커밋을 올리기 전에 git pull --rebase 를 하려면 히스토리가 필요하다
          fetch-depth: 0

      - name: GHCR login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # ID 가 비면 그 provider 의 로그인 버튼이 말없이 사라진 이미지가 만들어지므로 여기서 멈춘다.
      - name: Build image
        run: |
          for v in KAKAO_ID GOOGLE_ID NAVER_ID; do
            [ -n "${!v}" ] || { echo "::error::$v 값이 비어 있습니다. 저장소 Variables 에 ${v%_ID}_CLIENT_ID 를 등록하세요."; exit 1; }
          done
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-frontend"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f src/frontend/Dockerfile.prod \
            -t "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg VITE_SOCIAL_PROVIDERS=kakao,google,naver \
            --build-arg VITE_KAKAO_CLIENT_ID="$KAKAO_ID" \
            --build-arg VITE_KAKAO_REDIRECT_URI="$BASE_URL/auth/kakao/callback" \
            --build-arg VITE_GOOGLE_CLIENT_ID="$GOOGLE_ID" \
            --build-arg VITE_GOOGLE_REDIRECT_URI="$BASE_URL/auth/google/callback" \
            --build-arg VITE_NAVER_CLIENT_ID="$NAVER_ID" \
            --build-arg VITE_NAVER_REDIRECT_URI="$BASE_URL/auth/naver/callback" \
            src/frontend

      # push 전에 번들에 3종의 로그인 주소와 클라이언트 ID가 실제로 들어갔는지 확인한다. 하나라도 없으면 여기서 멈춘다.
      - name: Verify bundle
        run: |
          for needle in \
            "$BASE_URL/auth/kakao/callback" "$BASE_URL/auth/google/callback" "$BASE_URL/auth/naver/callback" \
            "$KAKAO_ID" "$GOOGLE_ID" "$NAVER_ID"; do
            docker run --rm --entrypoint grep "$IMAGE:$GITHUB_SHA" -rqF -- "$needle" /usr/share/nginx/html \
              || { echo "::error::번들에 값이 들어가지 않았습니다 (값은 로그에 남기지 않음)"; exit 1; }
          done

      - name: Push image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      # overlays/dev 의 프론트 태그를 이 SHA 로 바꿔 develop 에 커밋한다. Argo CD 가 이 변경을 보고 배포한다.
      # 봇 토큰으로 push 한 커밋은 다른 워크플로를 깨울 수 있지만, 각 워크플로의 paths 필터와 [skip ci] 로 다시 돌지 않는다.
      # 다른 서비스의 태그 커밋과 겹치면 push 가 거부되니 pull --rebase 후 다시 시도한다 (서로 다른 줄을 바꾸므로 충돌하지 않는다).
      - name: Bump overlay tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          bash infra/onprem/bump-image-tag.sh frontend "$GITHUB_SHA"
          BOT="${{ steps.bot.outputs.app-slug }}[bot]"
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"
          git add infra/k8s/overlays/dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "태그가 이미 같아서 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore: 프론트 이미지 태그를 ${GITHUB_SHA::7}로 갱신 [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin develop && git push origin HEAD:develop && exit 0
            sleep $((i * 3))
          done
          echo "::error::태그 커밋을 develop 에 push 하지 못했습니다. 브랜치 보호나 권한을 확인하세요."
          exit 1