# 온프렘 dev용 프론트 이미지를 GHCR에 올린다.
#   develop 에 src/frontend 가 머지되면 ghcr.io/<소유자>/<저장소>-frontend:<커밋 SHA> 를 만든다.
#   AWS(S3) 배포는 frontend-ci.yml 이 main 에서만 한다.
# 조직의 GHCR 는 여러 팀이 공유하므로 이름에 저장소 이름을 붙인다.
# 첫 이미지는 작업 브랜치(feat/#78-frontend-ghcr)에서도 만들어 확인하고, 확인 뒤 그 브랜치 줄은 지운다.
name: Onprem Frontend Image

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - 'feat/#78-frontend-ghcr'
    paths:
      - 'src/frontend/**'
      - '.github/workflows/onprem-frontend-ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    env:
      # 모든 PC의 온프렘 노드 IP가 같아서 이미지 하나를 같이 쓴다. 로그인 후 돌아오는 주소(redirect URI)가 이 값으로 만들어진다.
      BASE_URL: http://192.168.122.21:30080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # 구글은 IP·HTTP redirect URI 를 받지 않아 카카오만 켠다. VITE_* 값은 브라우저에 공개되는 번들 값이다.
      - name: Build image
        env:
          # 브라우저 번들에 공개되는 값이라 Secret 이든 Variable 이든 된다. Secret 이 있으면 그것을 쓴다.
          KAKAO_ID: ${{ secrets.KAKAO_CLIENT_ID || vars.KAKAO_CLIENT_ID }}
        run: |
          [ -n "$KAKAO_ID" ] || { echo "::error::KAKAO_CLIENT_ID 시크릿이 비어 있습니다. 비어 있으면 로그인이 안 되는 이미지가 만들어집니다."; exit 1; }
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-frontend"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f src/frontend/Dockerfile.prod \
            -t "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --build-arg VITE_SOCIAL_PROVIDERS=kakao \
            --build-arg VITE_KAKAO_CLIENT_ID="$KAKAO_ID" \
            --build-arg VITE_KAKAO_REDIRECT_URI="$BASE_URL/auth/kakao/callback" \
            --build-arg VITE_GOOGLE_CLIENT_ID= \
            --build-arg VITE_GOOGLE_REDIRECT_URI= \
            src/frontend

      # push 전에 번들에 로그인 주소와 카카오 ID가 실제로 들어갔는지 확인한다. 하나라도 없으면 여기서 멈춘다.
      - name: Verify bundle
        env:
          KAKAO_ID: ${{ secrets.KAKAO_CLIENT_ID || vars.KAKAO_CLIENT_ID }}
        run: |
          docker run --rm --entrypoint grep "$IMAGE:$GITHUB_SHA" -rqF "$BASE_URL/auth/kakao/callback" /usr/share/nginx/html
          docker run --rm --entrypoint grep "$IMAGE:$GITHUB_SHA" -rqF "$KAKAO_ID" /usr/share/nginx/html

      - name: Push image
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          echo "pushed $IMAGE:$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      # 다음 단계: overlays/dev 의 images 태그를 이 SHA 로 바꾸는 커밋 (BOT_PUSH_TOKEN 확인 후).
