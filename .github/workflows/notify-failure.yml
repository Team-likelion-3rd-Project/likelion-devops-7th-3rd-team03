# develop, main에서 워크플로가 실패하면 Slack으로 알린다.
#   - 온프렘 이미지 워크플로 → dev 채널 (SLACK_WEBHOOK_URL)
#   - Terraform (prod), main의 Frontend CI(prod 배포) → prod 채널 (SLACK_WEBHOOK_URL_PROD), 메시지 앞에 [prod]
#     Terraform은 develop에서 수동 실행해도 prod 인프라를 바꾸므로 브랜치와 상관없이 prod 채널로 보낸다.
#     apply 뒤에 호출되는 프론트 배포(Frontend deploy)는 Terraform 실행 안에서 돌아 Terraform 실패로 같이 잡힌다.
# 웹훅은 저장소 Secret으로만 둔다. 없으면 알림을 건너뛰고 경고만 남긴다.
# 시험: Actions 탭 > Notify Failure > Run workflow (channel 선택. 이 파일이 기본 브랜치 develop에 있어야 한다).
name: Notify Failure

on:
  workflow_run:
    workflows: ["Onprem Frontend Image", "Onprem Backend Images", "Terraform (prod)", "Frontend CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: 시험 알림을 보낼 채널
        type: choice
        options: [dev, prod]
        default: dev

permissions: {}

jobs:
  slack:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion) &&
       contains(fromJSON('["develop","main"]'), github.event.workflow_run.head_branch))
    runs-on: ubuntu-latest
    steps:
      - name: Send to Slack
        env:
          DEV_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          PROD_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL_PROD }}
          IS_PROD: >-
            ${{ github.event.workflow_run.name == 'Terraform (prod)' ||
                (github.event.workflow_run.name == 'Frontend CI' && github.event.workflow_run.head_branch == 'main') ||
                inputs.channel == 'prod' }}
          WF_NAME: ${{ github.event.workflow_run.name || '시험 알림' }}
          BRANCH: ${{ github.event.workflow_run.head_branch || '-' }}
          TITLE: ${{ github.event.workflow_run.display_title || '-' }}
          # Re-run 은 actor 가 처음 실행한 사람이라 triggering_actor(다시 실행한 사람)를 먼저 쓴다.
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login || github.actor }}
          RESULT: ${{ github.event.workflow_run.conclusion || '시험' }}
          RUN_URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        run: |
          if [ "$IS_PROD" = "true" ]; then
            URL="$PROD_WEBHOOK"; PREFIX="[prod] "; SECRET_NAME=SLACK_WEBHOOK_URL_PROD
          else
            URL="$DEV_WEBHOOK"; PREFIX=""; SECRET_NAME=SLACK_WEBHOOK_URL
          fi
          if [ -z "$URL" ]; then
            echo "::warning::$SECRET_NAME 이 없어 알림을 보내지 않았다"
            exit 0
          fi
          # Slack 은 & < > 를 멘션, 링크로 해석하니 (예: 커밋 제목의 <!channel>) 문자로 바꿔 둔다.
          esc() { printf '%s' "$1" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          text=$(printf ':x: %s*%s* 실패 (%s)\n브랜치: %s / 실행자: %s\n%s\n%s' "$PREFIX" "$(esc "$WF_NAME")" "$(esc "$RESULT")" "$(esc "$BRANCH")" "$(esc "$ACTOR")" "$(esc "$TITLE")" "$RUN_URL")
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -X POST -H 'Content-type: application/json' --data @- "$URL"
