# 커밋에 섞인 키·비밀번호를 PR·push 단계에서 막는다.
# 모든 경로에서 돌아야 하므로 서비스별 CI(paths 필터)와 분리한다.
# 이 검사를 브랜치 보호의 필수 검사로 지정해, 실패하면 머지가 안 되게 한다.
name: Secret Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          # 이번 PR·push에 들어온 커밋 범위를 보려면 히스토리가 필요하다
          fetch-depth: 0

      - name: Block committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "::error::.env 파일이 커밋되어 있습니다. 제거 후 다시 PR 하세요."
            exit 1
          fi
          echo "커밋된 .env 파일 없음"

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # 익명 다운로드는 GitHub 이 남용 트래픽을 막을 때 504 를 받는 일이 있어, 토큰으로 내려받고 재시도한다
          for i in 1 2 3; do
            gh release download "v${GITLEAKS_VERSION}" -R gitleaks/gitleaks \
              -p "$tarball" -p "$checksums" --clobber && break
            [ "$i" = 3 ] && exit 1
            echo "다운로드 실패, $((i * 10))초 뒤 재시도"; sleep $((i * 10))
          done
          grep " $tarball\$" "$checksums" | sha256sum -c -
          tar -xzf "$tarball" gitleaks

      # 이번에 새로 들어온 커밋만 검사한다 (과거 히스토리는 도입 시 한 번 따로 확인했다)
      - name: Gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="$SHA~1..$SHA"
          else
            RANGE="$PUSH_BEFORE..$SHA"
          fi
          echo "검사 범위: $RANGE"
          # --redact: 찾은 값을 로그에 그대로 남기지 않는다
          ./gitleaks git . --log-opts="$RANGE" --redact --verbose --exit-code 1