# 백엔드 이미지를 GHCR에 올린다. 온프렘 dev와 AWS prod가 같은 이미지를 쓴다 (#105).
#   develop 에 백엔드 코드가 머지되면 3개 이미지를 같은 커밋 SHA 태그로 만든다.
#   ghcr.io/<소유자>/<저장소>-management-service:<SHA>
#   ghcr.io/<소유자>/<저장소>-redirect-service:<SHA>
#   ghcr.io/<소유자>/<저장소>-db-migration:<SHA>
# 세 이미지 태그를 같게 맞춰서, overlay 의 images 를 태그 하나로 한 번에 바꿀 수 있게 한다.
# 이미지는 amd64·arm64 를 한 태그에 같이 올린다 (Apple Silicon 맥의 로컬 클러스터도 같은 태그를 받는다).
# push 전에 Trivy 로 CRITICAL 취약점을 검사해, 발견되면 그 이미지는 올리지 않는다.
# 세 이미지를 모두 올린 뒤 overlays/dev 와 overlays/prod 의 백엔드 태그를 이 SHA 로 바꿔 develop 에 커밋한다.
#   dev: 온프렘 Argo CD 가 develop 을 보고 바로 배포한다.
#   prod: 릴리스 PR 이 main 에 머지되면 AWS Argo CD 가 배포한다 (dev 에서 확인한 이미지가 그대로 prod 로 간다).
# 테스트는 PR 단계의 management-ci.yml, redirect-ci.yml 이 한다.
# 조직의 GHCR 는 여러 팀이 공유하므로 이름에 저장소 이름을 붙인다 (onprem-frontend-ci.yml 과 같은 규칙).
name: Onprem Backend Images

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'src/management-service/**'
      - 'src/redirect-service/**'
      - 'src/db/**'
      - '.github/workflows/onprem-backend-ci.yml'
      - '.github/scripts/trivy-scan.sh'

permissions:
  contents: read
  packages: write

# 같은 브랜치에 연속으로 머지되면 앞의 빌드는 취소하고 마지막 것만 올린다
concurrency:
  group: onprem-backend-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    # 평소 2~3분이고, arm64(QEMU) 단계가 붙어 몇 분 늘어난다. 멈추면 기본 6시간을 기다리지 않고 실패(timed_out)로 알린다.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: management-service
            context: src/management-service
          - service: redirect-service
            context: src/redirect-service
          - service: db-migration
            context: src/db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_ENV"

      # arm64 이미지의 대상 플랫폼 단계(DuckDB 확장 설치, CDS 아카이브 생성, microdnf)를 amd64 러너에서 돌리려면 QEMU 가 필요하다.
      # Gradle 빌드는 Dockerfile 에서 --platform=$BUILDPLATFORM 으로 러너에서 한 번만 하므로 QEMU 를 타지 않는다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: GHCR login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # push 전에 스캔하려고 러너와 같은 amd64 이미지를 로컬 Docker 에만 만든다 (--load 는 플랫폼 하나만 된다)
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # /actuator/info 에 보여줄 빌드 커밋
          build-args: GIT_SHA=${{ github.sha }}
          # 패키지를 이 저장소에 연결한다. 연결돼야 GITHUB_TOKEN 으로 다음 push 가 된다
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # 서비스별로 빌드 캐시를 나눠 Gradle 의존성을 매번 새로 받지 않게 한다
          cache-from: type=gha,scope=onprem-${{ matrix.service }}
          cache-to: type=gha,scope=onprem-${{ matrix.service }},mode=max

      - name: Date (Trivy DB cache key)
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # 취약점 DB만 하루 단위로 캐시한다. 세 이미지가 같은 DB를 쓴다.
      # 실행마다 새 캐시를 만들면 저장소 한도(10GB)가 차서 Gradle·Docker 빌드 캐시가 먼저 지워진다
      - name: Trivy DB cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: trivy-db-${{ steps.date.outputs.today }}
          restore-keys: trivy-db-

      # CRITICAL 취약점(패치 있는 것)이 있으면 여기서 멈춘다. 그 이미지는 push 되지 않는다
      - name: Scan (CRITICAL 이면 push 중단)
        run: bash .github/scripts/trivy-scan.sh "${IMAGE}:${GITHUB_SHA}"

      # 스캔을 통과하면 amd64·arm64 를 한 태그로 올린다. amd64 는 위 빌드 캐시를 그대로 쓴다.
      # arm64 는 같은 베이스 태그·같은 jar 라 패키지 버전이 같다고 보고 따로 스캔하지 않는다.
      # --provenance=false: GHCR 에 플랫폼 정보가 없는 unknown/unknown 항목이 따로 생기지 않게 한다.
      - name: Push (amd64, arm64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=onprem-${{ matrix.service }}
          cache-to: type=gha,scope=onprem-${{ matrix.service }},mode=max

      # 두 플랫폼이 모두 올라갔는지 확인한다. 하나라도 빠지면 태그 반영(bump-tag)으로 넘어가지 않는다
      - name: Verify platforms
        run: |
          docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA}" > /tmp/image-index.txt
          for p in linux/amd64 linux/arm64; do
            grep -Eq "Platform:[[:space:]]+$p" /tmp/image-index.txt || { echo "::error::푸시한 이미지에 $p 플랫폼이 없습니다"; exit 1; }
          done

      - name: Summary
        run: echo "pushed ${IMAGE}:${GITHUB_SHA} (linux/amd64, linux/arm64)" >> "$GITHUB_STEP_SUMMARY"

  # 세 이미지가 모두 올라간 뒤 한 번만 dev·prod overlay 의 백엔드 태그를 이 SHA 로 바꿔 develop 에 커밋한다.
  # Argo CD 가 이 변경을 보고 배포한다. 하나라도 실패하면(needs) 태그를 바꾸지 않아 세 이미지가 항상 같은 SHA 로 맞춰진다.
  bump-tag:
    name: Bump overlay tag
    needs: build-and-push
    runs-on: ubuntu-latest
    # 다른 브랜치에서 workflow_dispatch 로 돌릴 때 develop 태그를 건드리지 않는다
    if: github.ref == 'refs/heads/develop'
    # 태그 반영 커밋은 CI 봇 토큰으로 push 하므로 기본 토큰은 읽기만 한다
    permissions:
      contents: read
    steps:
      # develop 보호 규칙의 우회 대상인 CI 봇(GitHub App) 토큰을 받는다. 태그 커밋 push 에 쓴다.
      - name: CI 봇 토큰 발급
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.bot.outputs.token }}
          # 아래 git log $GITHUB_SHA..origin/develop 검사에 히스토리가 필요하다
          fetch-depth: 0

      # 최신 develop 위에서 태그를 바꿔 push 한다. 프론트·다른 백엔드 태그 커밋과 겹쳐 push 가 거부되면
      # 최신 develop 을 다시 받아 처음부터 다시 바꿔 push 한다. rebase 를 쓰지 않아서 충돌이 생기지 않는다.
      # 이 실행보다 더 새 백엔드 변경이 develop 에 이미 있으면 건너뛴다. 그 실행이 더 새 태그를 넣는다.
      # (늦게 끝난 실행이나 예전 실행 Re-run 이 최신 태그를 옛 SHA 로 덮어쓰는 것을 막는다)
      # 봇 토큰으로 push 한 커밋은 다른 워크플로를 깨울 수 있지만, 각 워크플로의 paths 필터와 [skip ci] 로 다시 돌지 않는다.
      - name: Bump overlay tag
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          BOT="${{ steps.bot.outputs.app-slug }}[bot]"
          git config user.name "$BOT"
          git config user.email "$(gh api "/users/$BOT" --jq .id)+$BOT@users.noreply.github.com"

          # 이 워크플로가 이미지를 새로 만드는 경로 (on.push.paths 와 같게 맞춘다)
          BACKEND_PATHS=(src/management-service src/redirect-service src/db
                         .github/workflows/onprem-backend-ci.yml .github/scripts/trivy-scan.sh)

          for i in 1 2 3; do
            # bash -e 라 fetch 가 실패하면 스텝이 바로 끝난다. 일시적인 네트워크 오류도 재시도하게 한다
            git fetch origin develop || { echo "fetch 실패, 재시도 ($i/3)"; sleep $((i * 3)); continue; }
            git reset --hard origin/develop

            if [ -n "$(git log --oneline "$GITHUB_SHA"..origin/develop -- "${BACKEND_PATHS[@]}")" ]; then
              echo "develop 에 이 실행(${GITHUB_SHA::7})보다 새 백엔드 변경이 있어 건너뜁니다. 그 실행이 태그를 바꿉니다."
              exit 0
            fi

            bash infra/onprem/bump-image-tag.sh management-service redirect-service db-migration "$GITHUB_SHA"
            FILE=infra/k8s/overlays/prod/kustomization.yaml \
              bash infra/onprem/bump-image-tag.sh management-service redirect-service db-migration "$GITHUB_SHA"
            git add infra/k8s/overlays/dev/kustomization.yaml infra/k8s/overlays/prod/kustomization.yaml
            if git diff --cached --quiet; then
              echo "태그가 이미 같아서 커밋하지 않습니다."
              exit 0
            fi
            git commit -m "chore: 백엔드 이미지 태그를 ${GITHUB_SHA::7}로 갱신 [skip ci]"

            git push origin HEAD:develop && exit 0
            echo "push 실패, develop 을 다시 받아 재시도 ($i/3)"
            sleep $((i * 3))
          done
          echo "::error::태그 커밋을 develop 에 push 하지 못했습니다. 브랜치 보호나 권한을 확인하세요."
          exit 1