# Argo CD Notifications: 배포가 실패하거나 앱이 Degraded가 되면 Slack으로 알린다.
# cp1에서 apply 한다 (infra/onprem/argocd/README.md 6번). cp-argocd.sh 가 설치할 때 같이 적용한다.
#   kubectl apply -f /home/k8s/argocd/notifications.yaml
#
# Slack 웹훅 URL 은 이 파일에 없다. argocd-notifications-secret 의 slack-webhook-url 키에서 읽는다 (README 6번).
# Application 이 알림을 받으려면 snipy-dev-app.yaml 처럼 subscribe annotation 이 있어야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  # Slack incoming webhook. 서비스 이름이 slack 이라 annotation 은 subscribe.<트리거>.slack 이다.
  service.webhook.slack: |
    url: $slack-webhook-url
    headers:
    - name: Content-Type
      value: application/json

  # 메시지에 따옴표가 들어 있는 필드(operationState.message 등)는 넣지 않는다. JSON 이 깨진다.
  template.app-sync-failed: |
    webhook:
      slack:
        method: POST
        body: |
          {"text": ":x: [Argo CD] {{.app.metadata.name}} 배포(Sync) 실패\n단계: {{.app.status.operationState.phase}} / 리비전: {{.app.status.sync.revision | trunc 7}}\n확인: kubectl -n argocd describe app {{.app.metadata.name}}"}
  template.app-health-degraded: |
    webhook:
      slack:
        method: POST
        body: |
          {"text": ":warning: [Argo CD] {{.app.metadata.name}} 상태 Degraded\n리비전: {{.app.status.sync.revision | trunc 7}}\n확인: kubectl -n snipy get pods"}

    # 메시지에 CronJob 의 마지막 실행 시각을 넣는다 (argocd-cm-patch.yaml 이 health.message 에 남긴 값)
  # {{ }} 안은 Go 템플릿이라 문자열을 백틱으로 쓴다 (\" 를 쓰면 템플릿 파싱이 깨져 이 앱의 알림 전체가 안 나간다)
  template.batch-failed: |
    webhook:
      slack:
        method: POST
        body: |
          {"text": ":x: [Argo CD] {{.app.metadata.name}} 배치(CronJob) 실패{{range .app.status.resources}}{{if eq .kind `CronJob`}} ({{.health.message}}){{end}}{{end}}\n확인: kubectl -n snipy get jobs --sort-by=.metadata.creationTimestamp (가장 아래 Failed 의 로그를 kubectl logs job/이름 으로 확인)"}
  template.batch-succeeded: |
    webhook:
      slack:
        method: POST
        body: |
          {"text": ":white_check_mark: [Argo CD] {{.app.metadata.name}} 배치(CronJob) 성공{{range .app.status.resources}}{{if eq .kind `CronJob`}} ({{.health.message}}){{end}}{{end}}"}

  # 상태가 바뀔 때 한 번만 보낸다. 정상 배포에는 아무것도 보내지 않는다.
  trigger.on-sync-failed: |
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
    
  # 배치 결과는 배포를 막지 않고 알림만 보낸다 (argocd-cm-patch.yaml 의 BATCH_LAST_RUN_* 표시).
  # oncePer 에 시각이 든 메시지를 넣어 실행마다 한 번씩 보낸다 (같은 결과를 반복해서 보내지 않는다).
  trigger.on-batch-failed: |
    - when: any(app.status.resources, {.kind == 'CronJob' && .health != nil && .health.message startsWith 'BATCH_LAST_RUN_FAILED'})
      oncePer: filter(app.status.resources, {.kind == 'CronJob'})[0].health.message
      send: [batch-failed]
  trigger.on-batch-succeeded: |
    - when: any(app.status.resources, {.kind == 'CronJob' && .health != nil && .health.message startsWith 'BATCH_LAST_RUN_SUCCEEDED'})
      oncePer: filter(app.status.resources, {.kind == 'CronJob'})[0].health.message
      send: [batch-succeeded]
