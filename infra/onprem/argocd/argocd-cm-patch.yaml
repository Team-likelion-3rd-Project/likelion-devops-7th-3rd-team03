# argocd-cm 에 덧붙이는 설정. cp-argocd.sh 가 설치 뒤 merge 로 적용한다.
data:
  # CronJob 건강 상태를 "마지막 실행 성공 여부"로 보지 않는다 (항상 Healthy).
  # VM 을 켠 직후 놓친 새벽 배치가 MySQL 보다 먼저 돌아 실패하면, 기본 규칙은 CronJob 을 Degraded 로 보고
  # CronJob 이 wave 0 이라 동기화 전체(마이그레이션 훅, 앱 교체)가 멈춘다.
  # 대신 마지막 실행 결과를 메시지에 시각과 함께 남기고, notifications.yaml 의 on-batch-succeeded / on-batch-failed 가 Slack 으로 알린다.
  # 시각을 넣어 두면 실행마다 메시지가 달라져, 연속으로 실패해도 회차마다 한 번씩 알림이 간다.
  resource.customizations.health.batch_CronJob: |
    hs = {}
    hs.status = "Healthy"
    hs.message = "배치 실행 결과는 배포 상태에서 제외한다"
    local s = obj.status
    if s ~= nil and s.lastScheduleTime ~= nil and (s.active == nil or #s.active == 0) then
      if s.lastSuccessfulTime ~= nil and s.lastSuccessfulTime >= s.lastScheduleTime then
        hs.message = "BATCH_LAST_RUN_SUCCEEDED " .. s.lastSuccessfulTime
      else
        hs.message = "BATCH_LAST_RUN_FAILED " .. s.lastScheduleTime
      end
    end
    return hs