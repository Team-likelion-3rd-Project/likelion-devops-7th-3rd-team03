# 온프렘 VM 클러스터의 dev 환경을 Argo CD가 develop 브랜치에서 가져오게 하는 Application.
# cp1에서 한 번만 적용한다 (infra/onprem/argocd/README.md 3번).
#   kubectl apply -f /home/k8s/argocd/snipy-dev-app.yaml
#
# 예전 클라우드 dev용 Application(infra/argocd/dev, #133에서 삭제)과 다른 점
#   - destination 네임스페이스가 snipy 다 (클라우드는 default).
#   - 자동 동기화는 켜지만 prune(Git에서 사라진 리소스 삭제)과 selfHeal(손으로 바꾼 것 자동 복구)은 끈다.
#   - RespectIgnoreDifferences 로 replicas 를 Sync 때 덮어쓰지 않는다.
#   - 동기화가 실패하면 retry 로 최대 2번 더 시도한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-dev
  namespace: argocd
  # 배포 실패나 Degraded 일 때 Slack 으로 알린다 (notifications.yaml, README 6번). 웹훅을 넣지 않은 클러스터에서는 알림만 안 간다.
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.slack: ""
    notifications.argoproj.io/subscribe.on-health-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-batch-failed.slack: ""
    notifications.argoproj.io/subscribe.on-batch-succeeded.slack: ""
spec:
  project: default
  source:
    repoURL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team03.git
    targetRevision: develop
    path: infra/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: snipy
  syncPolicy:
    # develop 에 머지되면 Argo CD 가 약 3분 안에 클러스터에 반영한다.
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - RespectIgnoreDifferences=true
    # 훅 Job 실패 등으로 동기화가 실패하면 30초, 60초 간격으로 2번 더 시도하고 멈춘다.
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  # HPA 가 replicas 를 조절하므로 Git 값과 달라도 OutOfSync 로 보지 않는다.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
