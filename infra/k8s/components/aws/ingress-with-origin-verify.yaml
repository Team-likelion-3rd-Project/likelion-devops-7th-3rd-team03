# AWS Load Balancer Controller가 이 Ingress를 보고 ALB를 자동 생성합니다.
# ALB가 생기면 external-dns가 아래 hostname 어노테이션(alb.<도메인>)으로 Route53 레코드를 만들고,
# CloudFront가 그 이름을 오리진으로 쓴다. terraform을 다시 apply할 필요가 없다.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snipy-ingress
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    # 인증서 ARN은 적지 않는다. 컨트롤러가 rules의 host와 맞는 ACM 인증서(terraform modules/edge)를 찾아 붙인다.
    # CloudFront 프리픽스 리스트만 인바운드 허용 (직접 인터넷 접근 차단)
    # terraform modules/edge의 SG를 이름(Name 태그)으로 지정 — 계정이 바뀌어도 그대로 쓴다.
    # 이 SG를 지정하면 컨트롤러가 별도 프론트엔드 SG를 자동 생성하지 않고 이 SG만 사용함
    alb.ingress.kubernetes.io/security-groups: "snipy-cluster-alb-sg"
    # 헬스체크 경로 설정
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/liveness
spec:
  ingressClassName: alb # AWS Load Balancer Controller가 처리한다 (helm이 만든 IngressClass)
  rules:
    - host: "snipy.life" # var.domain_name과 동일한 값으로 교체
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: management-service
                port:
                  number: 8080
          # TODO: ALB는 "/{shortcode}" 같은 경로 변수 문법을 모르고 '*'/'?' 와일드카드만 지원함.
          # 지금의 '/*'는 임시 스텁 — 프론트엔드(/  프리픽스)도 내부적으로 '/*'로 매칭되기 때문에
          # 이 규칙과 우선순위가 겹쳐서 둘 중 하나가 죽은 규칙이 됨. 백엔드/프론트 라우팅 완성 후
          # (예: redirect-service 전용 prefix, 또는 프론트를 서브도메인으로 분리) 재설계 필요.
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: redirect-service
                port:
                  number: 8080
