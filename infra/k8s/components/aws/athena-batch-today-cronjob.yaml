# 1시간마다 "오늘(KST) 지금까지"를 집계한다. Firehose → S3 → Glue → Athena → MySQL 경로가 하루 중에도 도는지 확인하고,
# 분포 통계(breakdown)를 다음 날까지 기다리지 않고 볼 수 있게 한다.
# 어제 확정 집계는 athena-batch(매일 KST 02:00)가 맡는다. 같은 날짜를 다시 돌려도 UPSERT 로 덮어쓴다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: athena-batch-today
  labels: { app: athena-batch }
spec:
  schedule: "30 * * * *"        # 매시 30분 (UTC 기준, KST 도 30분). 정각에 도는 일별 배치와 겹치지 않게
  concurrencyPolicy: Forbid     # 이전 실행이 안 끝났으면 건너뜀
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3000   # 50분. 쿼리 8개(일별 + 차원 7) × 최대 폴링 5분 = 최악 40분 + 여유, 다음 실행 전에 끝남
      template:
        metadata:
          labels: { app: athena-batch }
        spec:
          serviceAccountName: athena-batch-sa
          restartPolicy: Never
          containers:
            - name: athena-batch
              # 이미지는 kustomization replacements 가 management-service 이미지로 바꾼다
              image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/management-service:latest
              args: ["today"]
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: batch
                - name: JAVA_TOOL_OPTIONS
                  value: "-XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
              envFrom:
                - configMapRef: { name: management-service-config }
                - secretRef: { name: management-service-secrets }
                - configMapRef: { name: athena-batch-config }
              resources:
                requests: { cpu: 250m, memory: 512Mi }
                limits:   { cpu: 500m, memory: 2Gi }