apiVersion: v1
kind: ServiceAccount
metadata:
  name: redirect-service-sa
  annotations:
    # dev 클러스터의 실제 IRSA Role — modules/streaming이 "${var.cluster_name}-redirect-service-role"로
    # 이름을 짓기 때문에 dev(cluster_name=snipy-dev-cluster)는 prod와 ARN이 다르다.
    eks.amazonaws.com/role-arn: arn:aws:iam::834922934330:role/snipy-dev-cluster-redirect-service-role
