# 온프렘 클릭 이벤트 수집기 (AWS의 Firehose 역할). local/fluent-bit/fluent-bit.conf와 같은 설정
# 차이: Grace 30 (파드 종료 시 남은 데이터를 올릴 시간). 수정할 때 두 파일을 같이 맞춘다

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    # 종료 신호를 받으면 남은 데이터를 내보낼 때까지 최대 30초 기다린다 (파드 교체 시 유실 방지)
    Grace         30
    storage.path              /fluent-bit/state/storage
    storage.sync              normal
    storage.backlog.mem_limit 5M

[INPUT]
    Name              tail
    Tag               click.events
    Path              /var/log/snipy/click-events.log
    Parser            json
    DB                /fluent-bit/state/tail.db
    Read_from_Head    On
    Refresh_Interval  5
    storage.type      filesystem

[OUTPUT]
    Name               s3
    Match              click.*
    bucket             ${S3_BUCKET}
    region             us-east-1
    endpoint           http://seaweedfs:8333
    s3_key_format      /year=%Y/month=%m/day=%d/click-events-%H%M%S-$UUID.gz
    compression        gzip
    use_put_object     On
    total_file_size    5M
    upload_timeout     ${S3_UPLOAD_TIMEOUT}
    store_dir          /fluent-bit/s3-buffer
    json_date_key      false
    Retry_Limit        5