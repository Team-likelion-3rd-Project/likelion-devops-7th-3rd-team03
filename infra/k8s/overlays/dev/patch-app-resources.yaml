# 워커 2대(각 2 vCPU / 4GB)에 앱·DB·프론트를 같이 올리므로 파드 수와 요청량을 줄인다.
# 힙은 configmaps.yaml의 JAVA_TOOL_OPTIONS(-Xmx384m)에 맞춰 limit을 잡는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-service
spec:
  # 카나리 전환 후 Deployment 는 파드 템플릿 역할만 한다. 파드는 Rollout 이 띄운다 (workloadRef).
  # 1 로 두면 수동 동기화로 Git 값이 적용될 때 Deployment 파드가 다시 떠 Rollout 파드와 트래픽이 섞인다.
  # 카나리를 떼고 롤링 업데이트로 되돌릴 때는 이 값도 1 이상으로 되돌린다 (argo-rollouts/README.md 8절)
  replicas: 0
  template:
    spec:
      containers:
        - name: management-service
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 768Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect-service
spec:
  # 카나리 전환 후 Deployment 는 파드 템플릿 역할만 한다. 파드는 Rollout 이 띄운다 (workloadRef).
  # 1 로 두면 수동 동기화로 Git 값이 적용될 때 Deployment 파드가 다시 떠 Rollout 파드와 트래픽이 섞인다.
  # 카나리를 떼고 롤링 업데이트로 되돌릴 때는 이 값도 1 이상으로 되돌린다 (argo-rollouts/README.md 8절)
  replicas: 0
  template:
    spec:
      containers:
        - name: redirect-service
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits:   { cpu: 1000m, memory: 768Mi }
