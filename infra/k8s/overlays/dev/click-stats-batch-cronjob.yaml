# 온프렘 일별 클릭 집계 배치 (DuckDB). AWS의 athena-batch와 같은 앱(management 이미지, batch 프로필)을 엔진만 바꿔 실행한다.
# management-service의 ConfigMap·Secret을 그대로 쓰고, 배치 전용 값만 아래 env로 덮어쓴다 (env가 envFrom보다 우선).
# 설정 근거: 배치 안정화(#53), 방문자 수 정확한 값(#71) 로컬 실측 + 클러스터 실측
apiVersion: batch/v1
kind: CronJob
metadata:
  name: click-stats-batch
spec:
  # 매일 KST 02:00에 전날(KST) 데이터를 집계한다
  schedule: "0 2 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 앱 안에서 SeaweedFS·DB 재시도를 하므로 파드 재시도는 1회만 (노드 장애 대비)
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          # VM 을 켠 직후 놓친 배치를 따라잡을 때 MySQL·SeaweedFS 보다 먼저 뜨면 실패하고,
          # 배치는 "전날"만 집계해서 그날 통계가 빈 채로 남는다. 두 서비스가 연결을 받을 때까지 기다렸다 실행한다.
          # 새 이미지를 받지 않으려고 배치와 같은 이미지(bash 의 /dev/tcp)로 확인한다. 최대 10분 기다린다.
          initContainers:
            - name: wait-deps
              image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/management-service:latest
              command: [ "bash", "-c" ]
              args:
                - |
                  for target in mysql:3306 seaweedfs:8333; do
                    host=${target%:*}; port=${target#*:}
                    for i in $(seq 1 120); do
                      (exec 3<>/dev/tcp/$host/$port) 2>/dev/null && { echo "$target 연결됨"; break; }
                      [ "$i" -eq 120 ] && { echo "!! $target 에 10분 동안 연결하지 못했습니다"; exit 1; }
                      sleep 5
                    done
                  done
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
          containers:
            - name: batch
              image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/management-service:latest
              envFrom:
                - configMapRef: { name: management-service-config }
                - secretRef: { name: management-service-secrets }
              env:
                - name: SPRING_PROFILES_ACTIVE
                  value: batch
                - name: BATCH_ENGINE
                  value: duckdb
                # 메모리 배분: 힙 30%(약 307MB) + DuckDB 512MB + JVM 기타 약 150MB ≈ 969MB < limit 1Gi
                # (management-service-config의 -Xmx384m를 덮어쓴다)
                - name: JAVA_TOOL_OPTIONS
                  value: "-XX:MaxRAMPercentage=30 -XX:+ExitOnOutOfMemoryError"
                - name: DUCKDB_S3_ENDPOINT
                  value: seaweedfs:8333
                - name: DUCKDB_CLICK_LOG_BASE
                  value: s3://snipy-click-logs
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: seaweedfs-s3-secrets, key: S3_ACCESS_KEY } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: seaweedfs-s3-secrets, key: S3_SECRET_KEY } }
                # 정확한 방문자 수 (#71). 이미지 버전과 상관없이 명시한다
                - name: DUCKDB_EXACT_VISITOR_COUNT
                  value: "true"
                # 정확한 방문자 수 집계 (#71). 300만 건 기준 256·384MB는 OOM
                - name: DUCKDB_MEMORY_LIMIT
                  value: 512MB
                - name: DUCKDB_THREADS
                  value: "2"
                # 클러스터 실측: SeaweedFS 재기동 후 요청 수신까지 41초 → 최소 대기 약 90초가 되도록 10회
                - name: DUCKDB_RETRY_MAX_ATTEMPTS
                  value: "10"
              # DuckDB가 파드 안에서 직접 집계하므로 CPU 1코어 (AWS Athena 시절엔 500m)
              resources:
                requests: { cpu: 500m, memory: 1Gi }
                limits:   { cpu: "1", memory: 1Gi }