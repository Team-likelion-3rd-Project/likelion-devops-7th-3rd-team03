# src/db의 run-migration.sh를 실행해 DB·계정(00-database-setup.sql)과 V*.sql을 적용한다.
# 이미 적용된 버전은 건너뛰므로 여러 번 실행해도 안전하다.
#
# Argo CD Sync 훅으로 실행한다. 순서: MySQL(wave 0) → 이 Job(wave 1) → 앱(wave 2).
# PreSync는 모든 리소스보다 먼저 돌아 새 클러스터에서는 MySQL이 없어 실패하므로 Sync + wave를 쓴다.
# 새로 만들기 전에 이전 Job을 지운다(BeforeHookCreation). 그래서 TTL을 두지 않는다.
# 훅이 끝나지 않으면 앱 배포가 멈추므로 activeDeadlineSeconds로 전체 시간을 제한한다.
#
# kubectl apply -k로 손으로 적용할 때는 훅 어노테이션이 무시된다. 끝난 Job이 남아 있으면 지우고 적용한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # 일시적인 DB 연결 오류가 발생하면 Job을 최대 6번 다시 시도한다.
  backoffLimit: 6
  # 재시도 간격이 늘어나 Sync를 오래 붙잡지 않도록 전체를 10분으로 제한한다
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: db-migration
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shortlink"
            - name: DB_ROOT_USER
              value: "root"
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: DB_APP_PASSWORD }
            - name: MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: DB_MIGRATOR_PASSWORD }
            - name: READONLY_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: READONLY_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }