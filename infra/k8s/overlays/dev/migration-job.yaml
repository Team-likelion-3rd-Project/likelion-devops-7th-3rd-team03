# src/db의 run-migration.sh를 실행해 DB·계정(00-database-setup.sql)과 V*.sql을 적용한다.
# 이미 적용된 버전은 건너뛰므로 여러 번 실행해도 안전하다.
# Job은 spec을 바꿔 다시 적용할 수 없어서, 끝나고 일정 시간 뒤 지워지게 둔다. 지워진 뒤 다시 적용하면 새로 실행된다.
# MySQL이 아직 준비되지 않았으면 실패하고 backoffLimit 안에서 다시 시도한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: db-migration
          env:
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: "shortlink"
            - name: DB_ROOT_USER
              value: "root"
            - name: DB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: DB_APP_PASSWORD }
            - name: MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: DB_MIGRATOR_PASSWORD }
            - name: READONLY_PASSWORD
              valueFrom:
                secretKeyRef: { name: mysql-secrets, key: READONLY_PASSWORD }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
