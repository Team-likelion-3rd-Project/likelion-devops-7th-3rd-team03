# dev용 Redis 1대. 리다이렉트 캐시, 가입 대기 세션, 실시간 통계(잠정치)만 담는다.
# 영구 저장은 하지 않는다. 파드가 다시 뜨면 캐시는 DB에서 다시 채워지고, 진행 중인 가입 세션과 잠정 통계는 사라진다.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app: redis }
spec:
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: { app: redis }
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7
          # 메모리가 차면 오래된 키부터 지운다. 컨테이너 limit(256Mi)에 걸려 OOMKilled되면 캐시·세션이 한꺼번에 사라진다
          args: [ "--save", "", "--appendonly", "no", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru" ]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }
