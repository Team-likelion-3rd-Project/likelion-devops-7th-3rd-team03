apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: management-service-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # 마이그레이션 Job(-1)·앱(0)보다 먼저 시크릿을 만든다
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: management-service-secrets
  data:
    - secretKey: DB_APP_PASSWORD
      remoteRef:
        key: snipy-cluster/rds/app-user-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: snipy-cluster/app/jwt-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: snipy-cluster/redis/auth-token
  # 소셜 로그인 OAuth 값(JSON)의 키를 그대로 환경변수로 쓴다. 값이 빈 provider는 키가 없다
  dataFrom:
    - extract:
        key: snipy-cluster/app/oauth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redirect-service-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # 마이그레이션 Job(-1)·앱(0)보다 먼저 시크릿을 만든다
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redirect-service-secrets
  data:
    - secretKey: DB_APP_PASSWORD
      remoteRef:
        key: snipy-cluster/rds/app-user-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: snipy-cluster/app/jwt-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: snipy-cluster/redis/auth-token
---
# 마이그레이션 Job(migration-job.yaml)용. 이름은 src/db/run-migration.sh의 환경변수와 같다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-migration-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-2" # 마이그레이션 Job(-1)·앱(0)보다 먼저 시크릿을 만든다
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-migration-secrets
  data:
    - secretKey: DB_ROOT_PASSWORD # RDS 마스터(app_admin) — DB·계정 생성용
      remoteRef:
        key: snipy-cluster/rds/app-password
    - secretKey: APP_PASSWORD # 앱 계정(shortlink_app). 앱의 DB_APP_PASSWORD와 같은 값
      remoteRef:
        key: snipy-cluster/rds/app-user-password
    - secretKey: MIGRATOR_PASSWORD
      remoteRef:
        key: snipy-cluster/rds/migrator-password
    - secretKey: READONLY_PASSWORD
      remoteRef:
        key: snipy-cluster/rds/readonly-password