apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: management-service-secrets
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: management-service-secrets
  data:
    - secretKey: DB_APP_PASSWORD
      remoteRef:
        key: snipy-cluster/rds/app-user-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: snipy-cluster/app/jwt-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: snipy-cluster/redis/auth-token
  # 소셜 로그인 OAuth 값(JSON)의 키를 그대로 환경변수로 쓴다. 값이 빈 provider는 키가 없다
  dataFrom:
    - extract:
        key: snipy-cluster/app/oauth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redirect-service-secrets
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redirect-service-secrets
  data:
    - secretKey: DB_APP_PASSWORD
      remoteRef:
        key: snipy-cluster/rds/app-user-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: snipy-cluster/app/jwt-secret
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: snipy-cluster/redis/auth-token