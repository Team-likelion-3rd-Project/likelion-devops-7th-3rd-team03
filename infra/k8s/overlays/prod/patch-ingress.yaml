apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: snipy-ingress
  annotations:
    # external-dns가 이 이름으로 ALB 레코드를 만든다 (CloudFront 오리진)
    external-dns.alpha.kubernetes.io/hostname: "alb.snipy.life"
spec:
  rules:
    - host: "snipy.life"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: management-service
                port:
                  number: 8080
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: redirect-service
                port:
                  number: 8080
