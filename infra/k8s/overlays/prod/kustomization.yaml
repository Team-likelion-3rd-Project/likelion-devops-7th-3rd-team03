apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base가 prod 값을 그대로 담고 있어서 패치 없음 — kubectl apply -k overlays/prod는
# 지금까지의 kubectl apply -f infra/k8s/ 와 결과가 동일하다.
resources:
  - ../../base
  - external-secrets.yaml

patches:
  - path: patch-athena-configmap.yaml
  - path: patch-athena-sa.yaml
  - path: patch-ingress.yaml
  - path: patch-athena-cronjob.yaml
