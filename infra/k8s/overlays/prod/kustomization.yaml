apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 공통 리소스는 base, AWS 전용 리소스는 components/aws에서 가져오고 prod 값은 아래 patch로 채운다.
resources:
  - ../../base
  - external-secrets.yaml
  - migration-job.yaml

components:
  - ../../components/aws
  - ../../components/monitoring

patches:
  - path: patch-sa.yaml
  - path: patch-athena-configmap.yaml
  - path: patch-athena-sa.yaml
  - path: patch-ingress.yaml
  - path: patch-athena-cronjob.yaml

# 마이그레이션 이미지는 온프렘 CI(onprem-backend-ci)가 GHCR에 올리는 것을 쓴다.
# prod 이미지 레지스트리와 태그 자동 갱신은 (다)-2에서 정한다.
images:
  - name: db-migration
    newName: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team03-db-migration
    newTag: c571ad7d5d79b9e4aa7ddc1c1fb07a6cc802c8d9
