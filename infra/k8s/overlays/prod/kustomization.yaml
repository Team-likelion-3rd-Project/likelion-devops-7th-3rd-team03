apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 공통 리소스는 base, AWS 전용 리소스는 components/aws에서 가져오고 prod 값은 아래 patch로 채운다.
resources:
  - ../../base
  - external-secrets.yaml
  - migration-job.yaml

components:
  - ../../components/aws
  - ../../components/monitoring

patches:
  - path: patch-sa.yaml
  - path: patch-athena-configmap.yaml
  - path: patch-athena-sa.yaml
  - path: patch-ingress.yaml
  - path: patch-athena-cronjob.yaml

# 이미지는 온프렘 CI(onprem-backend-ci)가 GHCR에 한 번 빌드·스캔해 올린 것을 dev와 같이 쓴다 (#105).
# 그 CI가 dev overlay와 이 파일의 태그를 같은 SHA로 develop에 커밋하고, 릴리스 PR이 main에 머지되면 prod에 배포된다.
# name은 base 매니페스트에 적힌 이미지 이름이다 (dev overlay와 같은 규칙).
images:
  - name: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/management-service
    newName: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team03-management-service
    newTag: e69a4a5765ec4e6cb62aa7c17d228804e54a241a
  - name: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/redirect-service
    newName: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team03-redirect-service
    newTag: e69a4a5765ec4e6cb62aa7c17d228804e54a241a
  - name: db-migration
    newName: ghcr.io/team-likelion-3rd-project/likelion-devops-7th-3rd-team03-db-migration
    newTag: e69a4a5765ec4e6cb62aa7c17d228804e54a241a
