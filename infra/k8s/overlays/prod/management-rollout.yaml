# management-service를 롤링 업데이트 대신 카나리로 배포한다 (Argo Rollouts, dev overlay와 같은 방식).
# base Deployment는 그대로 두고, Rollout이 workloadRef로 Deployment의 파드 템플릿(zone spread 패치 포함)을 넘겨받는다.
# Rollout이 정상으로 뜨면 원래 Deployment는 0개로 줄인다(scaleDown: onsuccess). Deployment의 replicas는
# snipy-prod Application의 ignoreDifferences로 Argo CD가 되돌리지 않는다.
#
# 단계: 새 버전을 파드 50%로 → 1분 대기 → k6가 카나리 파드에만 2분간 요청해 판단 → 통과하면 100%, 실패하면 자동 롤백.
# ALB는 management-service Service의 파드(카나리·stable 모두)로 보내므로 트래픽은 파드 수 비율로 나뉜다.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: management-service
  annotations:
    # 마이그레이션 Job(-1) 다음, prod 앱과 같은 wave
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels: { app: management-service }
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: management-service
    scaleDown: onsuccess
  strategy:
    canary:
      # Argo Rollouts가 selector에 버전 해시를 붙여 각각 카나리·stable 파드만 가리키게 만든다.
      # k6는 카나리 Service로만 요청해서 새 버전만 판단한다.
      canaryService: management-service-canary
      stableService: management-service-stable
      steps:
        - setWeight: 50
        # 새 파드는 JVM 예열 때문에 처음 수십 초가 느리다 (management에는 워밍업이 없다)
        - pause: { duration: 60s }
        - analysis:
            templates:
              - templateName: management-canary-k6
            args:
              - name: target
                value: http://management-service-canary.default.svc:8080
        - setWeight: 100
---
# 카나리 판단 전용 Service. app 라벨을 붙이지 않는다:
# ServiceMonitor가 app 라벨로 Service를 고르므로, 붙이면 같은 파드를 Service 3개로 중복 수집한다.
apiVersion: v1
kind: Service
metadata:
  name: management-service-canary
  labels: { canary-of: management-service }
spec:
  selector: { app: management-service }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: management-service-stable
  labels: { canary-of: management-service }
spec:
  selector: { app: management-service }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
