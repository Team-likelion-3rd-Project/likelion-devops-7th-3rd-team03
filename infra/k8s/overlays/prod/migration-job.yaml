# src/db의 run-migration.sh로 DB·계정(00-database-setup.sql)과 V*.sql을 적용한다.
# 이미 적용된 버전은 건너뛰고 스키마를 되돌리지는 않는다 (롤백을 고려한 작성 규칙은 #125).
#
# ArgoCD: Sync 단계 훅 + sync-wave -1. 시크릿(-2)이 준비된 뒤, 앱(0)보다 먼저 실행된다.
#   앱이 ddl-auto: validate라 스키마가 먼저 맞아야 하고, Job이 실패하면 앱 배포로 넘어가지 않는다.
#   PreSync 훅은 시크릿 저장소가 아직 없는 첫 배포에서 실패하므로 쓰지 않는다.
#   동기화마다 이전 Job을 지우고 새로 만든다(BeforeHookCreation). Job spec은 바꿀 수 없어서다.
# kubectl apply -k로 배포하면 어노테이션은 무시되고 일반 Job으로 실행된다.
#   다시 적용하려면 kubectl delete job db-migration 후 적용한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: db-migration
          env:
            # 접속 정보는 terraform이 만드는 앱 ConfigMap과 같은 값을 쓴다
            - name: DB_HOST
              valueFrom: { configMapKeyRef: { name: management-service-config, key: DB_HOST } }
            - name: DB_PORT
              valueFrom: { configMapKeyRef: { name: management-service-config, key: DB_PORT } }
            - name: DB_NAME
              valueFrom: { configMapKeyRef: { name: management-service-config, key: DB_NAME } }
            - name: DB_ROOT_USER
              value: app_admin # RDS 마스터 계정 (terraform modules/database)
          envFrom:
            - secretRef: { name: db-migration-secrets }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 256Mi }