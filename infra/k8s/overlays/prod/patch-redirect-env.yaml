# prod redirect 에만 넣는 고정 환경변수.
# terraform ConfigMap 은 apply 승인을 기다려 이미지보다 늦게 반영되므로, terraform 출력값이 필요 없는 고정값은 여기에 둔다 (#274)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redirect-service
spec:
  template:
    spec:
      # 종료 때 남은 요청 → 실행기 큐 → Firehose 큐를 순서대로 비우는 데 30초(기본)를 넘길 수 있다 (#263)
      terminationGracePeriodSeconds: 60
      containers:
        - name: redirect-service
          env:
            # 클릭마다 콘솔에 JSON 로그를 남기지 않는다. prod 는 클릭을 Firehose 로 보낸다
            - name: CLICK_EVENT_CONSOLE_LOG_ENABLED
              value: "false"