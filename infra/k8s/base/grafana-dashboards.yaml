apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-redirect-service
  labels:
    grafana_dashboard: "1"
data:
  shortlink-backend-overview.json: |
    {
      "title": "shortlink backend overview",
      "uid": "shortlink-backend-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "job",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(up, job)",
            "refresh": 2,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(up{job=\"$job\"}, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        { "id": 100, "type": "row", "title": "JVM / Process", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 } },
        {
          "id": 1,
          "type": "stat",
          "title": "Uptime",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            { "expr": "process_uptime_seconds{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Live Threads",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "targets": [
            { "expr": "jvm_threads_live_threads{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "{{instance}}" }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "CPU Usage",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 }, "overrides": [] },
          "targets": [
            { "expr": "process_cpu_usage{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "process {{instance}}" },
            { "expr": "system_cpu_usage{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "system {{instance}}" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "JVM Heap Used",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "bytes", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{area=\"heap\", job=\"$job\", instance=~\"$instance\"}",
              "legendFormat": "{{instance}} {{id}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "GC Pause Time Ratio",
          "description": "jvm_gc_pause_seconds_sum rate: GC pause가 wall-clock 시간에서 차지하는 비율 (action=minor/major GC별)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 14 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (action, instance) (rate(jvm_gc_pause_seconds_sum{job=\"$job\", instance=~\"$instance\"}[$__rate_interval]))",
              "legendFormat": "{{action}} {{instance}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Throttled Periods",
          "description": "container_cpu_cfs_throttled_periods_total rate: 파드가 CPU limit에 막혀 실행이 지연된 횟수/초. 0보다 크면 그 순간 CPU limit을 다 쓴 것 — kubelet(cAdvisor) 메트릭이라 job=\"redirect-service\"가 아니라 pod 이름으로 매칭($job 드롭다운 값과 파드 이름 접두사가 같아서 pod=~\"$job.*\"로 매칭)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 21 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"default\", pod=~\"$job.*\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HikariCP Connection Pool",
          "description": "hikaricp_connections_*: DB 커넥션 풀 상태 (active/idle/pending/max)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 28 },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0 }, "overrides": [] },
          "targets": [
            { "expr": "hikaricp_connections_active{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "active {{instance}}" },
            { "expr": "hikaricp_connections_idle{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "idle {{instance}}" },
            { "expr": "hikaricp_connections_pending{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "pending {{instance}}" },
            { "expr": "hikaricp_connections_max{job=\"$job\", instance=~\"$instance\"}", "legendFormat": "max {{instance}}" }
          ]
        },
        { "id": 101, "type": "row", "title": "Redirect Service", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 35 } },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Redirect Outcome Rate",
          "description": "redirect_outcome_total: 리다이렉트 요청의 최종 결과 (SUCCESS/NOT_FOUND/EXPIRED/DISABLED)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(redirect_outcome_total{job=\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Cache Result Rate",
          "description": "redirect_cache_result_total: Redis 캐시 조회 결과 (hit/miss/error)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (result) (rate(redirect_cache_result_total{job=\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Redirect Outcome Rate by Instance",
          "description": "redirect_outcome_total을 outcome 안 나누고 instance(파드)별로 합산 — 선들이 서로 붙어있으면 파드에 트래픽이 고르게 분산되는 것, 벌어지면 쏠림",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 44 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (instance) (rate(redirect_outcome_total{job=\"$job\", instance=~\"$instance\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Cache Lookup Avg Latency",
          "description": "redirect_cache_lookup_duration_seconds: 캐시 조회 평균 레이턴시",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 52 },
          "fieldConfig": { "defaults": { "unit": "s", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "rate(redirect_cache_lookup_duration_seconds_sum{job=\"$job\"}[$__rate_interval]) / rate(redirect_cache_lookup_duration_seconds_count{job=\"$job\"}[$__rate_interval])",
              "legendFormat": "avg lookup latency"
            }
          ]
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Click Stats Flush Rate",
          "description": "redirect_click_stats_flush_total: 실시간 통계 Redis flush 성공/실패",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 52 },
          "fieldConfig": { "defaults": { "unit": "reqps", "min": 0 }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (result) (rate(redirect_click_stats_flush_total{job=\"$job\"}[$__rate_interval]))",
              "legendFormat": "{{result}}"
            }
          ]
        }
      ]
    }
