apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-service
  labels: { app: management-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: management-service }
  template:
    metadata:
      labels: { app: management-service }
    spec:
      containers:
        - name: management-service
          image: 834922934330.dkr.ecr.ap-southeast-1.amazonaws.com/management-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: management-service-config }
            - secretRef: { name: management-service-secrets }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
            # redirect-service와 같은 이유 (#260). 1분 동안 계속 응답이 없을 때만 재시작한다.
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 1Gi }
