apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-dev-observability
  namespace: argocd
spec:
  project: default
  source:
    chart: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 88.5.0
    helm:
      releaseName: kube-prometheus
      values: |
        # prometheuses/alertmanagers CRD가 커서 ArgoCD sync 결과가 etcd 메시지 크기(2MB)를
        # 넘어 상태 기록 자체가 실패함 (ResourceExhausted). CRD는 미리 별도로
        # server-side apply 해두고, 여기서는 차트가 CRD를 다시 관리하지 않게 끈다.
        crds:
          enabled: false
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            serviceMonitorNamespaceSelector: {}
            enableRemoteWriteReceiver: true
            retention: 3d
            # 원래 100m/512Mi(limit 500m/1Gi)였는데 부하테스트 중 WAL replay가 44초+
            # 걸리면서 startup probe 타임아웃에 걸려 계속 재시작하는 크래시루프가 남 —
            # CPU 부족이 원인으로 보여 넉넉히 올림.
            resources:
              requests: { cpu: 300m, memory: 1Gi }
              limits: { cpu: 1500m, memory: 2Gi }
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests: { storage: 5Gi }
        grafana:
          admin:
            existingSecret: grafana-admin-credentials
          # replicaCount 1 + RWO(EBS) PVC 조합에서 기본 RollingUpdate 전략을 쓰면,
          # 새 pod가 다른 노드에 뜰 때 기존 pod가 아직 볼륨을 붙잡고 있어
          # Multi-Attach 에러로 영원히 데드락됨. 볼륨을 공유 못 하니 기존 pod를
          # 먼저 내리는 Recreate로 바꿔야 함.
          deploymentStrategy:
            type: Recreate
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          persistence:
            enabled: true
            storageClassName: gp3
            size: 2Gi
        alertmanager:
          enabled: false
        # grafana-admin-credentials 시크릿을 수동 kubectl create 없이 ESO로 자동 생성.
        # aws_secretsmanager_secret.grafana_admin_password (modules/app-secrets)를 그대로 당겨온다.
        extraManifests:
          - apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: grafana-admin-credentials
            spec:
              secretStoreRef:
                name: aws-secrets-manager
                kind: ClusterSecretStore
              target:
                name: grafana-admin-credentials
                template:
                  mergePolicy: Merge # 기본값 Replace면 template.data가 통째로 덮어써서
                    # data:로 따로 가져온 admin-password가 사라짐
                  data:
                    admin-user: admin
              data:
                - secretKey: admin-password
                  remoteRef:
                    key: snipy-dev-cluster/app/grafana-admin-password
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # alertmanagers/prometheuses CRD가 커서 client-side apply 시
        # last-applied-configuration 어노테이션이 262144바이트 제한을 넘어 동기화 실패함
