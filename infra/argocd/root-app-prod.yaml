apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team03.git
    targetRevision: main
    path: infra/argocd/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
