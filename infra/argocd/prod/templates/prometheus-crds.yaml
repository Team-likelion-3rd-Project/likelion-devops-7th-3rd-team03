# Prometheus Operator CRD(ServiceMonitor, Prometheus 등). 예전에는 클러스터마다 손으로 server-side apply 했다.
# kube-prometheus-stack(observability.yaml)은 CRD를 관리하지 않으므로(crds.enabled: false) 여기서 먼저 설치한다.
# 버전은 kube-prometheus-stack 88.5.0의 operator(v0.93.1)와 맞춘다. 차트를 올릴 때 같이 올린다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-prod-prometheus-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: prometheus-operator-crds
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 31.0.1
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
    # 첫 배포에서 다른 앱(CRD·시크릿 저장소)이 아직 준비되지 않아 실패해도 다시 시도한다.
    # (자동 동기화는 retry가 없으면 같은 커밋으로 다시 시도하지 않는다)
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      # CRD가 커서 client-side apply의 last-applied 어노테이션 제한(262144바이트)을 넘는다
      - ServerSideApply=true
