# Argo CD 알림이 쓰는 Slack 웹훅. bootstrap이 만든 Secrets Manager 시크릿(값은 README 3-6)을 가져온다.
# argocd 차트는 이 Secret을 만들지 않게 했다 (modules/gitops/argocd-notifications-values.yaml의 notifications.secret.create: false).
# 시크릿 저장소(ClusterSecretStore)는 snipy-prod(wave 0)가 만들어서 그 다음(1)에 만든다.
# 이 파일은 Helm 템플릿이라 템플릿 중괄호를 쓰지 않는다 (주석 안에서도 Helm이 해석한다. ESO 템플릿이 필요하면 이스케이프해야 한다).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-secret
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: argocd-notifications-secret
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: snipy-cluster/app/slack-webhook
