apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-prod
  namespace: argocd
  annotations:
    # 순서: Prometheus CRD·Argo Rollouts(-1) → 앱(0, ServiceMonitor·Rollout이 CRD 필요) → 모니터링(1)
    argocd.argoproj.io/sync-wave: "0"
    # prod Slack 알림 (modules/gitops/argocd-notifications-values.yaml)
    notifications.argoproj.io/subscribe.on-sync-failed.slack: ""
    notifications.argoproj.io/subscribe.on-health-degraded.slack: ""
    notifications.argoproj.io/subscribe.on-batch-failed.slack: ""
    notifications.argoproj.io/subscribe.on-batch-today-failed.slack: ""
    notifications.argoproj.io/subscribe.on-batch-succeeded.slack: ""
spec:
  project: default
  source:
    repoURL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team03.git
    targetRevision: {{ .Values.targetRevision }}
    path: infra/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      # 첫 배포에서 다른 앱(CRD·시크릿 저장소)이 아직 준비되지 않아 실패해도 다시 시도한다.
      # (자동 동기화는 retry가 없으면 같은 커밋으로 다시 시도하지 않는다)
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    # 아래 ignoreDifferences를 동기화할 때도 적용한다 (없으면 동기화마다 Git의 replicas로 되돌린다)
    syncOptions:
      - RespectIgnoreDifferences=true
  # 파드 수는 HPA가 조절하므로 Git 값과 달라도 OutOfSync로 보지 않고 되돌리지도 않는다.
  #   Deployment: 카나리 전환 후에는 Rollout이 0개로 줄여 둔다 (workloadRef scaleDown)
  #   Rollout: HPA가 늘린 값을 selfHeal이 2로 되돌리지 않게 한다
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
