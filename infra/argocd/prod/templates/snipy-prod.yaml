apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-prod
  namespace: argocd
  annotations:
    # 순서: Prometheus CRD(-1) → 앱(0, ServiceMonitor가 CRD 필요) → 모니터링(1)
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/Team-likelion-3rd-Project/likelion-devops-7th-3rd-team03.git
    targetRevision: {{ .Values.targetRevision }}
    path: infra/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      # 첫 배포에서 다른 앱(CRD·시크릿 저장소)이 아직 준비되지 않아 실패해도 다시 시도한다.
      # (자동 동기화는 retry가 없으면 같은 커밋으로 다시 시도하지 않는다)
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
