# Argo Rollouts 컨트롤러 (redirect·management 카나리). Rollout·AnalysisTemplate CRD도 이 차트가 설치한다.
# 앱(snipy-prod, wave 0)이 Rollout을 쓰므로 그보다 먼저(-1) 설치한다.
# 버전은 온프렘(infra/onprem/argo-rollouts, v1.8.3)과 맞춘다. 차트 2.40.5 = v1.8.3
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: snipy-prod-argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: argo-rollouts
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 2.40.5
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    # 첫 배포에서 다른 앱이 아직 준비되지 않아 실패해도 다시 시도한다
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # 차트 CRD의 preserveUnknownFields: false는 기본값이라 API 서버가 저장하지 않는다.
  # 그래서 Git과 계속 달라 보여 OutOfSync가 되므로 비교에서 뺀다 (동작에는 차이 없음)
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields
