# 온프렘 클릭 이벤트 수집기 (AWS의 Firehose 역할)
# redirect-service가 기록한 click-events.log를 읽어서 내보낸다.

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Tag               click.events
    Path              /var/log/snipy/click-events.log
    Parser            json
    # 어디까지 읽었는지 기록한다. 재시작해도 이어서 읽는다.
    DB                /fluent-bit/state/tail.db
    # 처음 기동할 때는 파일에 이미 있는 줄도 읽는다.
    Read_from_Head    On
    Refresh_Interval  5

# 하위 3: 수집 확인용. 하위 4에서 SeaweedFS(s3) 출력으로 바꾼다.
[OUTPUT]
    Name    stdout
    Match   click.*
    Format  json_lines