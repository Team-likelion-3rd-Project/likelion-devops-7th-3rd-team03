# 온프렘 클릭 이벤트 수집기 (AWS의 Firehose 역할)
# redirect-service가 기록한 click-events.log를 읽어서 SeaweedFS(S3 호환)에 적재한다.

[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    # 처리 중인 데이터를 디스크에 둔다. 강제 종료돼도 재시작 후 이어서 보낸다.
    storage.path              /fluent-bit/state/storage
    storage.sync              normal
    storage.backlog.mem_limit 5M

[INPUT]
    Name              tail
    Tag               click.events
    Path              /var/log/snipy/click-events.log
    Parser            json
    # 어디까지 읽었는지 기록한다. 재시작해도 이어서 읽는다.
    DB                /fluent-bit/state/tail.db
    # 처음 기동할 때는 파일에 이미 있는 줄도 읽는다.
    Read_from_Head    On
    Refresh_Interval  5
    # 읽은 데이터를 메모리가 아니라 디스크 버퍼에 쌓는다
    storage.type      filesystem

# AWS Firehose 설정(infra/terraform/modules/streaming)과 같은 규칙으로 적재한다.
# 파티션 year=/month=/day=(UTC), gzip, 5MB 또는 업로드 주기 중 먼저 도달하는 쪽.
[OUTPUT]
    Name               s3
    Match              click.*
    bucket             ${S3_BUCKET}
    region             us-east-1
    endpoint           http://seaweedfs:8333
    s3_key_format      /year=%Y/month=%m/day=%d/click-events-%H%M%S-$UUID.gz
    compression        gzip
    use_put_object     On
    total_file_size    5M
    upload_timeout     ${S3_UPLOAD_TIMEOUT}
    # 업로드 전 데이터를 보관하는 로컬 버퍼. 볼륨에 둬서 재시작해도 남게 한다.
    store_dir          /fluent-bit/s3-buffer
    # Fluent Bit이 붙이는 수집 시각(date) 필드를 빼서 Firehose와 같은 원본 JSON만 저장한다.
    json_date_key      false
    Retry_Limit        5