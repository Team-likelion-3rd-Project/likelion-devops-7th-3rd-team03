global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: redirect-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["redirect-service:8080"]

  - job_name: management-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["management-service:8080"]
