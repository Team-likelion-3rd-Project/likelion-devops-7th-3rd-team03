name: shortlink

services:
  mysql:
    image: mysql:8.0
    command: --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-shortlink}
      MYSQL_USER: ${DB_APP_USER:-shortlink_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
      # migration 컨테이너가 root로 초기 DB/계정을 만들 수 있게 한다.
      # 포트는 로컬 호스트에만 열리며, root 비밀번호는 .env로만 주입한다.
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  migration:
    # 애플리케이션보다 먼저 DB 계정과 스키마를 준비하는 일회성 작업이다.
    image: mysql:8.0
    working_dir: /migrations
    entrypoint: ["/bin/bash", "/migrations/run-migration.sh"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_ROOT_USER: root
      DB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_PASSWORD: ${DB_APP_PASSWORD}
      MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-readonly_local_pw}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-shortlink_migrator}
    volumes:
      - ./src/db:/migrations:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  management-service:
    build:
      context: ./src/management-service
    environment:
      # 컨테이너에서는 localhost가 아닌 Compose 서비스명으로 접속한다.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_APP_USER: ${DB_APP_USER:-shortlink_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-shortlink}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIRECT_CACHE_TTL: ${REDIRECT_CACHE_TTL:-10m}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-1800}
      JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-1209600}
      SHORT_URL_BASE_URL: ${SHORT_URL_BASE_URL}
    ports:
      - "${MANAGEMENT_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully

  redirect-service:
    build:
      context: ./src/redirect-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_APP_USER: ${DB_APP_USER:-shortlink_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-shortlink}?serverTimezone=UTC&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER:-shortlink_migrator}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIRECT_CACHE_TTL: ${REDIRECT_CACHE_TTL:-10m}
      REDIRECT_LOG_LEVEL: ${REDIRECT_LOG_LEVEL:-DEBUG}
      VISITOR_COOKIE_SECURE: ${VISITOR_COOKIE_SECURE:-false}
      VISITOR_COOKIE_NAME: ${VISITOR_COOKIE_NAME:-visitor_id}
      VISITOR_COOKIE_MAX_AGE: ${VISITOR_COOKIE_MAX_AGE:-365d}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-true}
      REALTIME_STATS_TTL: ${REALTIME_STATS_RETENTION:-3d}
      REALTIME_STATS_FLUSH_INTERVAL: ${REALTIME_STATS_FLUSH_INTERVAL:-5s}
      REALTIME_STATS_BUFFER_CAPACITY: ${REALTIME_STATS_BUFFER_CAPACITY:-100000}
      # ▼ 추가: 로컬은 온프렘 모드. 클릭 이벤트를 파일로 기록하고 Fluent Bit이 수집한다
      CLICK_EVENT_SINK: ${CLICK_EVENT_SINK:-log}
      CLICK_EVENT_LOG_PATH: /var/log/snipy/click-events.log
    # ▼ 추가: 클릭 이벤트 로그 파일 (Fluent Bit과 공유 예정)
    volumes:
      - click-logs:/var/log/snipy
    ports:
      - "${REDIRECTOR_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      migration:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      redirect-service:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./local/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started

  frontend:
    build:
      context: ./src/frontend
    environment:
      # 브라우저 요청(/api)은 Vite dev proxy를 거쳐 Compose 서비스명으로 전달한다.
      VITE_API_PROXY_TARGET: http://management-service:8080
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      # 프런트와 백엔드는 같은 Kakao 앱·Redirect URI를 반드시 사용한다.
      VITE_KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      VITE_KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      management-service:
        condition: service_started

  # 온프렘 클릭 로그 저장소 (S3 호환). AWS 환경의 S3 역할을 대신한다.
  # MinIO 커뮤니티 버전 종료(2026.04)로 SeaweedFS를 사용한다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    # 비밀값을 파일로 커밋하지 않도록, 기동 시 .env 값으로 S3 인증 설정을 만든다.
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"local","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    ports:
      - "${S3_PORT:-8333}:8333"

  # 클릭 로그 버킷 자동 생성 (1회 실행 후 종료)
  seaweedfs-init:
    # 2.23 이상은 기본 체크섬 방식이 바뀌어 일부 S3 호환 저장소와 맞지 않을 수 있어 그 이전 버전으로 고정
    image: amazon/aws-cli:2.17.0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-snipy-click-logs}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do
          echo "waiting for seaweedfs..."; sleep 2
        done
        aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://$${S3_BUCKET}" || true
        echo "bucket ready: $${S3_BUCKET}"
    depends_on:
      - seaweedfs
    restart: "no"

  # 클릭 이벤트 수집기 (AWS의 Firehose 역할)
  # redirect-service와 같은 볼륨을 붙여 click-events.log를 읽고, SeaweedFS에 적재한다.
  fluent-bit:
    image: fluent/fluent-bit:3.2.10
    environment:
      # Fluent Bit의 S3 출력은 AWS 표준 환경변수로 인증한다
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-snipy-click-logs}
      # 운영 기준 5분(Firehose와 동일). 로컬 테스트 시 .env에서 1m 등으로 줄인다.
      S3_UPLOAD_TIMEOUT: ${S3_UPLOAD_TIMEOUT:-5m}
    volumes:
      - ./local/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - click-logs:/var/log/snipy:ro
      - fluent-bit-state:/fluent-bit/state
      - fluent-bit-s3-buffer:/fluent-bit/s3-buffer
    depends_on:
      redirect-service:
        condition: service_started
      seaweedfs-init:
        condition: service_completed_successfully

    # 온프렘 일별 집계 배치 (k8s에서는 CronJob이 매일 실행)
  # 로컬에서는 필요할 때 직접 실행한다: docker compose run --rm batch 2026-10-13
  batch:
    build:
      context: ./src/management-service
    # docker compose up 할 때 같이 뜨지 않도록 프로필로 분리. run으로 지정하면 실행된다
    profiles: ["batch"]
    # ▼ k8s CronJob의 memory limit과 같은 조건. 넘으면 커널이 OOMKilled로 죽인다 (스왑 금지)
    mem_limit: ${BATCH_MEM_LIMIT:-2g}
    memswap_limit: ${BATCH_MEM_LIMIT:-2g}
    environment:
      SPRING_PROFILES_ACTIVE: batch
      BATCH_ENGINE: duckdb
      # ▼ 기본값은 현재 AWS CronJob과 동일. 실험할 때 셸 환경변수로 덮어쓴다
      JAVA_TOOL_OPTIONS: ${BATCH_JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
      # ▼ DuckDB 메모리 상한
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-512MB}
      # DB (management-service와 동일)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shortlink}
      DB_APP_USER: ${DB_APP_USER:-shortlink_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-shortlink}?serverTimezone=UTC&characterEncoding=UTF-8&rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 배치에선 안 쓰지만 앱 설정에 기본값이 없어 기동에 필요한 값들
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      SHORT_URL_BASE_URL: ${SHORT_URL_BASE_URL}
      # DuckDB → SeaweedFS
      DUCKDB_S3_ENDPOINT: seaweedfs:8333
      DUCKDB_CLICK_LOG_BASE: s3://${S3_BUCKET:-snipy-click-logs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      seaweedfs-init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  grafana-data:
  click-logs:
  seaweedfs-data:
  fluent-bit-state:
  fluent-bit-s3-buffer: